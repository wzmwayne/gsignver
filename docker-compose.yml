# 类树莓派 / 1GB 内存场景的参考编排。
# 关键点：每个副本必须使用独立的 data 卷（KV 有排他文件锁），
# 若要横向扩容，请在网关按 app_id 分片路由到不同副本。
services:
  gsignver:
    build:
      context: .
      args:
        VERSION: "1.0.0"
    image: gsignver:1.0.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GSIGNVER_DATA: /data
      GSIGNVER_ADDR: ":8080"
      # 生产环境请从外部注入，使数据文件与其解密密钥分离
      # GSIGNVER_MASTER_KEY: "<32 字节 hex 或 base64>"
      # GSIGNVER_PEPPER: "<32 字节 hex 或 base64>"
      # 服务端运行期间签发激活码需要它；未设置则 /admin/v1/* 返回 404
      # GSIGNVER_ADMIN_TOKEN: "<随机令牌>"
      GOMEMLIMIT: 48MiB
      GOGC: "50"
    volumes:
      - gsignver-data:/data
    # 1GB 机器的资源护栏
    mem_limit: 64m
    cpus: 0.5

volumes:
  gsignver-data:
